    <rect x="150" y="140" width="110" height="80"/>
    <path d="M150,140 A55,55 0 0 1 260,140 Z"/>
    <circle cx="205" cy="80" r="7"/>
    <rect x="135" y="160" width="18" height="60"/>
    <circle cx="144" cy="158" r="10"/>
    <rect x="257" y="160" width="18" height="60"/>
    <circle cx="266" cy="158" r="10"/>

    <!-- zwei Hochhäuser -->
    <rect x="290" y="90" width="38" height="130"/>
    <rect x="332" y="112" width="32" height="108"/>

    <!-- verbindende niedrige Blöcke -->
    <rect x="368" y="168" width="30" height="52"/>
    <rect x="402" y="150" width="24" height="70"/>

    <!-- Brandenburger Tor — flache Attika, keine Kreise -->
    <rect x="444" y="140" width="14" height="55"/>
    <rect x="466" y="140" width="14" height="55"/>
    <rect x="488" y="140" width="14" height="55"/>
    <rect x="510" y="140" width="14" height="55"/>
    <rect x="532" y="140" width="14" height="55"/>
    <rect x="430" y="128" width="130" height="12"/>
    <rect x="440" y="108" width="110" height="20"/>

    <!-- verbindende niedrige Blöcke -->
    <rect x="564" y="160" width="28" height="60"/>
    <rect x="596" y="175" width="20" height="45"/>

    <!-- Fernsehturm -->
    <polygon points="622,220 631,94 645,94 654,220"/>
    <circle cx="638" cy="80" r="18"/>
    <polygon points="635,62 638,8 641,62"/>

    <!-- verbindende niedrige Blöcke -->
    <rect x="676" y="165" width="26" height="55"/>
    <rect x="706" y="150" width="22" height="70"/>
    <rect x="732" y="172" width="24" height="48"/>

    <!-- Reichstag -->
    <rect x="760" y="150" width="180" height="70"/>
    <rect x="825" y="118" width="50" height="32"/>
    <polygon points="825,118 875,118 850,98"/>
    <rect x="768" y="95" width="4" height="55"/>
    <rect x="924" y="95" width="4" height="55"/>

    <!-- dichte niedrige Reihenbebauung zum rechten Rand -->
    <rect x="944" y="160" width="30" height="60"/>
    <rect x="978" y="148" width="26" height="72"/>
    <rect x="1008" y="168" width="34" height="52"/>
    <rect x="1046" y="155" width="24" height="65"/>
    <rect x="1074" y="172" width="30" height="48"/>
    <rect x="1108" y="150" width="22" height="70"/>
    <rect x="1134" y="165" width="26" height="55"/>

    <!-- rechter Rand — Höhe identisch zum linken Rand -->
    <rect x="1160" y="160" width="40" height="60"/>
